<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Läs · Krislåda</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Krislåda">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b5cad">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%91%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#f6f5f2; --fg:#1d1d1f; --muted:#5f5f66; --card:#ffffff; --line:#e3e1dc; --accent:#0b5cad; --red:#b3261e; --redbg:#fdecea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --fg:#f2f2f4; --muted:#a3a3ab; --card:#1f1f23; --line:#2e2e34; --accent:#6aa9ff; --red:#ff8a80; --redbg:#3a1d1b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.6 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  a { color: var(--accent); }
  .top { display:flex; gap:16px; flex-wrap:wrap; font-size:16px; }
  .top a { text-decoration:none; }
  .alert { background: var(--redbg); border: 1px solid var(--red); border-radius: 12px; padding: 8px 12px; margin: 12px 0; font-size: 16px; }
  .alert b { color: var(--red); }
  article { background: var(--card); border:1px solid var(--line); border-radius:12px; padding: 4px 20px 16px; }
  article h1 { font-size: 26px; line-height: 1.25; margin: 16px 0 8px; }
  article h4 { font-size: 19px; margin: 22px 0 6px; }
  article ul, article ol { padding-left: 24px; }
  article li { margin: 4px 0; }
  article table { border-collapse: collapse; font-size: 16px; display:block; overflow-x:auto; }
  article td, article th { border:1px solid var(--line); padding: 4px 8px; text-align:left; vertical-align: top; }
  .src { color: var(--muted); font-size: 15px; }
  .err { color: var(--red); }
  @media print { .top, .alert { display: none; } article { border: 0; } body { background: #fff; color: #000; } }
</style>
</head>
<body>
<main>
  <div class="top"><a href="../">← Krislåda</a><a href="../ai/">🤖 Fråga AI</a><a href="#" onclick="print(); return false">🖨 Skriv ut</a></div>
  <div class="alert"><b>Livsfara? Ring 112</b> om någon telefon fungerar.</div>
  <article id="doc"><p>Laddar…</p></article>
</main>
<script src="../lib/md.js"></script>
<script>
(() => {
  // Shows a saved text document (Markdown) from documents/, for reading without internet.
  const f = new URLSearchParams(location.search).get('f') || '';
  const box = document.getElementById('doc');
  if (!/^docs\/[^?#]+\.(md|txt)$/.test(f) || f.includes('..')) { box.innerHTML = '<p class="err">Okänt dokument.</p>'; return; }
  fetchDoc(f)
    .then(t => { const d = renderMarkdown(t); box.innerHTML = d.html; if (d.title) document.title = d.title + ' · Krislåda'; })
    .catch(() => { box.innerHTML = '<p class="err">Dokumentet hittades inte. Kör installationen igen för att hämta det.</p>'; });
})();
</script>
</body>
</html>
