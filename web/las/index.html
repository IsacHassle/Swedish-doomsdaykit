<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Läs · Krislåda</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Krislåda">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b5cad">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%91%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  main { max-width: 780px; }
  .tools { display: flex; gap: 8px; margin: 16px 0 10px; flex-wrap: wrap; }
  article { background: var(--panel); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--shadow); padding: 6px 22px 18px; font-size: 18px; line-height: 1.55; margin-bottom: 30px; }
  article h1 { font: 800 32px/1.05 var(--cond); text-transform: uppercase; margin: 16px 0 8px; }
  article h4 { font: 800 21px/1.1 var(--cond); text-transform: uppercase; margin: 24px 0 6px; padding-bottom: 3px; border-bottom: 2px solid var(--ink); }
  article ul, article ol { padding-left: 24px; } article li { margin: 4px 0; }
  article table { border-collapse: collapse; font-size: 16px; display: block; overflow-x: auto; }
  article td, article th { border: 1px solid var(--ink); padding: 4px 8px; text-align: left; vertical-align: top; }
  .src { font: 600 12px/1.5 var(--mono); color: var(--muted); }
  .err { color: var(--red); font-weight: 700; }
  @media print { .tools, .warn { display: none; } article { border: 0; box-shadow: none; } }
</style>
</head>
<header class="topbar"><div class="wrap">
  <a class="back" href="/">← Krislåda</a>
  <span class="logo" style="font-size:26px">Läs</span>
  <div class="meta">Sparat för läsning<br>utan internet</div>
</div></header>
<div class="hazard"></div>
<body>
<main>
  <div class="tools"><a class="btn ghost" href="../ai/">Fråga AI</a><a class="btn ghost" href="#" onclick="print(); return false">Skriv ut</a></div>
  <div class="warn" style="border-left-color: var(--red)"><b>Livsfara? Ring 112</b> om någon telefon fungerar.</div>
  <article id="doc"><p>Laddar…</p></article>
</main>
<script src="../lib/md.js"></script>
<script>
(() => {
  // Shows a saved text document (Markdown) from documents/, for reading without internet.
  const f = new URLSearchParams(location.search).get('f') || '';
  const box = document.getElementById('doc');
  if (!/^docs\/[^?#]+\.(md|txt)$/.test(f) || f.includes('..')) { box.innerHTML = '<p class="err">Okänt dokument.</p>'; return; }
  fetchDoc(f)
    .then(t => { const d = renderMarkdown(t); box.innerHTML = d.html; if (d.title) document.title = d.title + ' · Krislåda'; })
    .catch(() => { box.innerHTML = '<p class="err">Dokumentet hittades inte. Kör installationen igen för att hämta det.</p>'; });
})();
</script>
</body>
</html>
